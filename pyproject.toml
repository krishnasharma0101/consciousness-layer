[project]
name = "conslayer"
version = "0.0.1"
description = "Experimental memory-graph layer from 'A Mathematical Framework for Artificial Consciousness' (testing it as LLM memory, not as consciousness)"
requires-python = ">=3.10"
dependencies = ["numpy", "networkx>=3", "pandas", "matplotlib"]

[project.optional-dependencies]
llm = ["torch", "transformers>=4.45", "sentence-transformers"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
